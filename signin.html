<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Coconut</title>
  <link rel="icon" type="image/x-icon" href="coconut.jpeg">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; font-family: Arial, sans-serif; color: white;
      background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url("Coconut-Palm.jpg") center / cover no-repeat; }
    .auth-card { width: min(100%, 400px); margin: clamp(24px, 10vh, 100px) auto 0; padding: 24px;
      border-radius: 14px; background: rgba(0,0,0,.45); }
    .front-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .coco-nut { width: 64px; height: 64px; object-fit: cover; border-radius: 50%; }
    .coco-name { margin: 0; }
    .front-letter { font-size: 1.6rem; margin: 0 0 8px; }
    .second-front { margin: 0 0 24px; }
    .sign-in { display: flex; flex-direction: column; gap: 14px; }
    .sign-in input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #bbb; border-radius: 6px; font: inherit; }
    .sign-in input[type="submit"] { border: 0; background: aquamarine; cursor: pointer; }
    @media (max-width: 480px) { body { padding: 16px; } .auth-card { margin-top: 8vh; padding: 20px; } }
  </style>
</head>
<body>
  <main class="auth-card">
    <div class="front-logo"><img class="coco-nut" src="coconut.jpeg" alt="Coconut"><p class="coco-name">Coconut</p></div>
    <h1 class="front-letter">Welcome back</h1>
    <p class="second-front">Access your saved charts</p>
    <form class="sign-in">
      <input type="email" placeholder="mail@example.com" aria-label="Email address" required>
      <input type="password" placeholder="Password" aria-label="Password" required>
      <input type="submit" value="Sign in">
    </form>
  </main>
</body>
</html>

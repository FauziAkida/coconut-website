<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to your Coco Bay account."><title>Sign in | Coco Bay</title><link rel="icon" href="coconut.jpeg"><link rel="stylesheet" href="style.css"></head><body><main class="auth"><section class="auth-photo" aria-label="Tropical coconut beach"><div class="auth-photo-copy"><p class="kicker">Coco Bay</p><h1>A little island feeling, every day.</h1><p>Thoughtful coconut essentials inspired by the coast.</p></div></section><section class="auth-side"><div class="auth-box"><a class="logo" href="index.html"><img src="coconut.jpeg" alt=""><span>Coco Bay</span></a><h2>Welcome back</h2><p class="auth-intro">Sign in to continue to your account.</p><form class="auth-form" action="#" method="get"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required></div><button class="pill" type="submit">Sign in</button></form><p class="switch">New to Coco Bay? <a href="signup.html">Create an account</a></p><a class="back" href="index.html">← Back to home</a></div></section></main></body></html>

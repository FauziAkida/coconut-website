<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create a Coco Bay account."><title>Join Coco Bay</title><link rel="icon" href="coconut.jpeg"><link rel="stylesheet" href="style.css"></head><body><main class="auth"><section class="auth-photo" aria-label="Tropical coconut beach"><div class="auth-photo-copy"><p class="kicker">Coco Bay</p><h1>Make room for something lovely.</h1><p>Explore everyday essentials with a little tropical spirit.</p></div></section><section class="auth-side"><div class="auth-box"><a class="logo" href="index.html"><img src="coconut.jpeg" alt=""><span>Coco Bay</span></a><h2>Create your account</h2><p class="auth-intro">Join us for a little more island in your everyday.</p><form class="auth-form" action="#" method="get"><div class="field"><label for="name">Your name</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Create a password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></div><button class="pill" type="submit">Create account</button></form><p class="switch">Already have an account? <a href="signin.html">Sign in</a></p><a class="back" href="index.html">← Back to home</a></div></section></main></body></html>
